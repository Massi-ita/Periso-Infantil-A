<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periso Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>⚽ Periso Dashboard</h1>
    <p>Temporada 2026-2027</p>
</header>

<div class="container">

    <section class="card">
        <h2>Próximo Partido</h2>
        <div id="nextMatch">
            Cargando...
        </div>
    </section>

    <section class="card">
        <h2>Clasificación</h2>
        <table id="standings">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Equipo</th>
                    <th>Pts</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Últimos Resultados</h2>
        <ul id="results"></ul>
    </section>

    <section class="card">
        <h2>Jugador Destacado</h2>

        <div class="player-card">
            <img src="https://via.placeholder.com/250x300" alt="Jugador">

            <h3>Diego De Gennaro Serrano</h3>

            <p>Temporada 2026-2027</p>
        </div>
    </section>

</div>

<script src="script.js"></script>

</body>
</html>
